# Pre-commit hooks for jctl
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=100]
        language_version: python3

  # Python linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Security scanning with Bandit (jctl directory only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.1
    hooks:
      - id: bandit
        args: [-ll, -r, jctl/]
        files: ^jctl/.*\.py$
        exclude: ^tests/

  # Optional: Type checking with mypy (commented out for now)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports, --check-untyped-defs]
  #       additional_dependencies: [types-PyYAML, types-requests]
  #       files: ^jctl/

# Configuration
default_language_version:
  python: python3

# Only process files in cli/jenkins directory
files: ^cli/jenkins/

# Skip certain files
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      __pycache__/|
      \.pytest_cache/|
      \.mypy_cache/|
      \.ruff_cache/|
      build/|
      dist/|
      \.eggs/|
      .*\.egg-info/|
      # Exclude everything outside cli/jenkins
      (?!cli/jenkins/).*
  )$
