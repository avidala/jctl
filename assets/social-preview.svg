<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>

  <!-- Grid pattern (subtle) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Central content -->
  <g transform="translate(640, 320)">

    <!-- Pipeline icon (left of text) -->
    <g transform="translate(-300, -100)">
      <!-- Vertical pipes -->
      <rect x="0" y="0" width="24" height="200" rx="12" fill="url(#pipeGradient)"/>
      <rect x="80" y="30" width="24" height="170" rx="12" fill="url(#pipeGradient)"/>
      <rect x="160" y="15" width="24" height="185" rx="12" fill="url(#pipeGradient)"/>

      <!-- Connecting lines -->
      <line x1="24" y1="100" x2="80" y2="115" stroke="url(#pipeGradient)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <line x1="104" y1="115" x2="160" y2="107" stroke="url(#pipeGradient)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

      <!-- Glow effect -->
      <circle cx="12" cy="100" r="30" fill="#3b82f6" opacity="0.2" filter="blur(15px)"/>
      <circle cx="92" cy="115" r="30" fill="#06b6d4" opacity="0.2" filter="blur(15px)"/>
      <circle cx="172" cy="107" r="30" fill="#06b6d4" opacity="0.2" filter="blur(15px)"/>
    </g>

    <!-- Main text: jctl -->
    <text x="0" y="20" font-family="'Courier New', 'Monaco', monospace" font-size="140" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="8">
      jctl
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="'Arial', 'Helvetica', sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
      Jenkins Control CLI
    </text>

    <!-- Feature badges -->
    <g transform="translate(-200, 120)">
      <!-- Okta badge -->
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#3b82f6" opacity="0.2"/>
      <text x="70" y="27" font-family="Arial" font-size="18" font-weight="600" fill="#60a5fa" text-anchor="middle">
        Okta SSO
      </text>
    </g>

    <g transform="translate(-40, 120)">
      <!-- Python badge -->
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#10b981" opacity="0.2"/>
      <text x="70" y="27" font-family="Arial" font-size="18" font-weight="600" fill="#34d399" text-anchor="middle">
        Python 3.10+
      </text>
    </g>

    <g transform="translate(120, 120)">
      <!-- MIT badge -->
      <rect x="0" y="0" width="120" height="40" rx="20" fill="#f59e0b" opacity="0.2"/>
      <text x="60" y="27" font-family="Arial" font-size="18" font-weight="600" fill="#fbbf24" text-anchor="middle">
        MIT
      </text>
    </g>

    <!-- Security lock icon -->
    <g transform="translate(320, -80)">
      <circle cx="0" cy="0" r="40" fill="#10b981" opacity="0.3"/>
      <path d="M -15 0 L -15 -10 Q -15 -20 0 -20 Q 15 -20 15 -10 L 15 0"
            stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="-18" y="0" width="36" height="28" rx="4" fill="#10b981"/>
      <circle cx="0" cy="14" r="5" fill="#0f172a"/>
    </g>

  </g>
</svg>
