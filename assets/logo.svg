<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="400" height="120" rx="12" fill="#1e293b"/>

  <!-- Icon: Pipeline symbol (left side) -->
  <g transform="translate(30, 30)">
    <!-- Vertical pipes -->
    <rect x="0" y="0" width="8" height="60" rx="4" fill="url(#gradient)"/>
    <rect x="20" y="10" width="8" height="50" rx="4" fill="url(#gradient)"/>
    <rect x="40" y="5" width="8" height="55" rx="4" fill="url(#gradient)"/>

    <!-- Connecting lines -->
    <line x1="8" y1="30" x2="20" y2="35" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="35" x2="40" y2="32" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text: jctl -->
  <text x="110" y="70" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#f8fafc" letter-spacing="2">
    jctl
  </text>

  <!-- Subtitle -->
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">
    Jenkins Control CLI
  </text>

  <!-- Lock icon (security badge) -->
  <g transform="translate(360, 15)">
    <rect x="0" y="8" width="20" height="16" rx="2" fill="#10b981" opacity="0.2"/>
    <path d="M 6 8 L 6 5 Q 6 0 10 0 Q 14 0 14 5 L 14 8" stroke="#10b981" stroke-width="2" fill="none"/>
    <circle cx="10" cy="16" r="2" fill="#10b981"/>
  </g>
</svg>
