<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e293b"/>

  <!-- Pipeline icon (center) -->
  <g transform="translate(60, 60)">
    <!-- Vertical pipes -->
    <rect x="0" y="0" width="12" height="80" rx="6" fill="url(#iconGradient)"/>
    <rect x="32" y="15" width="12" height="65" rx="6" fill="url(#iconGradient)"/>
    <rect x="64" y="8" width="12" height="72" rx="6" fill="url(#iconGradient)"/>

    <!-- Connecting lines -->
    <line x1="12" y1="40" x2="32" y2="47" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="47" x2="64" y2="44" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Letter 'j' overlay -->
  <text x="100" y="140" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="#f8fafc" text-anchor="middle" opacity="0.3">
    j
  </text>

  <!-- Security lock badge (top right) -->
  <g transform="translate(155, 25)">
    <circle cx="10" cy="10" r="15" fill="#10b981"/>
    <path d="M 6 10 L 6 7 Q 6 4 10 4 Q 14 4 14 7 L 14 10" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <rect x="5" y="10" width="10" height="8" rx="1" fill="#1e293b"/>
    <circle cx="10" cy="14" r="1.5" fill="#10b981"/>
  </g>
</svg>
