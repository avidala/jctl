<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Pipeline icon (centered) -->
  <g transform="translate(146, 130)">
    <!-- Vertical pipes -->
    <rect x="0" y="0" width="28" height="252" rx="14" fill="url(#pipeGrad)"/>
    <rect x="84" y="40" width="28" height="212" rx="14" fill="url(#pipeGrad)"/>
    <rect x="168" y="20" width="28" height="232" rx="14" fill="url(#pipeGrad)"/>

    <!-- Connecting lines -->
    <line x1="28" y1="126" x2="84" y2="146" stroke="url(#pipeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <line x1="112" y1="146" x2="168" y2="136" stroke="url(#pipeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

    <!-- Glow effects -->
    <circle cx="14" cy="126" r="35" fill="#3b82f6" opacity="0.3" filter="blur(20px)"/>
    <circle cx="98" cy="146" r="35" fill="#06b6d4" opacity="0.3" filter="blur(20px)"/>
    <circle cx="182" cy="136" r="35" fill="#06b6d4" opacity="0.3" filter="blur(20px)"/>
  </g>

  <!-- Letter 'j' overlay (bottom) -->
  <text x="256" y="450" font-family="'Courier New', 'Monaco', monospace" font-size="180" font-weight="bold" fill="#f8fafc" text-anchor="middle" opacity="0.25" letter-spacing="4">
    j
  </text>

  <!-- Security lock badge (top right corner) -->
  <g transform="translate(405, 60)">
    <circle cx="0" cy="0" r="45" fill="#10b981"/>
    <path d="M -18 0 L -18 -12 Q -18 -24 0 -24 Q 18 -24 18 -12 L 18 0"
          stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-20" y="0" width="40" height="30" rx="4" fill="#1e293b"/>
    <circle cx="0" cy="15" r="6" fill="#10b981"/>
  </g>
</svg>
