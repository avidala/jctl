<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avatarPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avatarShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#avatarBg)"/>

  <!-- Outer glow ring -->
  <rect x="10" y="10" width="380" height="380" rx="70"
        fill="none" stroke="url(#avatarPipe)" stroke-width="2" opacity="0.3"/>

  <!-- Central content -->
  <g transform="translate(200, 200)">

    <!-- Pipeline icon (top) -->
    <g transform="translate(-70, -90)">
      <!-- Three pipes -->
      <rect x="0" y="0" width="22" height="120" rx="11" fill="url(#avatarPipe)"/>
      <rect x="59" y="15" width="22" height="105" rx="11" fill="url(#avatarPipe)"/>
      <rect x="118" y="8" width="22" height="112" rx="11" fill="url(#avatarPipe)"/>

      <!-- Connections -->
      <line x1="22" y1="60" x2="59" y2="67" stroke="url(#avatarPipe)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <line x1="81" y1="67" x2="118" y2="64" stroke="url(#avatarPipe)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

      <!-- Glow effects -->
      <circle cx="11" cy="60" r="25" fill="#3b82f6" opacity="0.3" filter="blur(15px)"/>
      <circle cx="70" cy="67" r="25" fill="#06b6d4" opacity="0.3" filter="blur(15px)"/>
      <circle cx="129" cy="64" r="25" fill="#06b6d4" opacity="0.3" filter="blur(15px)"/>
    </g>

    <!-- Monogram 'AV' -->
    <text x="0" y="40" font-family="'Courier New', 'Monaco', monospace"
          font-size="110" font-weight="bold" fill="#f8fafc"
          text-anchor="middle" letter-spacing="5">
      AV
    </text>

    <!-- Security shield (bottom) -->
    <g transform="translate(0, 120)">
      <path d="M 0,-22 L -20,-12 L -20,10 Q -20,26 0,34 Q 20,26 20,10 L 20,-12 Z"
            fill="url(#avatarShield)" opacity="0.9"/>
      <path d="M -4,2 L 0,9 L 10,-6"
            stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>
</svg>
