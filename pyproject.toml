[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jctl"
version = "0.2.2"
description = "A flexible Jenkins CLI tool with Okta SSO authentication - Part of AVIDALA DevOps Tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Avner Vidal", email = "avnervidal27@gmail.com"}
]
maintainers = [
    {name = "AVIDALA", email = "avnervidal27@gmail.com"}
]
keywords = ["jenkins", "cli", "devops", "automation", "cicd", "pipeline", "avidala"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.25.2,<0.29",
    "keyring>=25.7.0",
    "pydantic>=2.13.4",
    "python-jenkins>=1.8.1",
    "pyyaml>=6.0.1",
    "cryptography>=43.0.1,<47.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.1.4,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.15.1",
    "black>=23.12.0",
    "ruff>=0.15.13",
    "mypy>=1.8.0",
    "bandit>=1.9.4",
    "pre-commit>=3.6.0",
]

[project.scripts]
jctl = "jctl.__main__:main"

[project.urls]
Homepage = "https://github.com/avidala/jctl"
Repository = "https://github.com/avidala/jctl"
Issues = "https://github.com/avidala/jctl/issues"
Documentation = "https://github.com/avidala/jctl/blob/main/README.md"
Changelog = "https://github.com/avidala/jctl/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["jctl*"]

# Completion is now generated on demand by `jctl completion --install`
# (which uses Click's built-in completion API), so we no longer ship any
# scripts/ files — and the previous package-data glob never worked anyway
# because `scripts/` lives outside the `jctl/` package.

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    # UP038: ruff suggests rewriting `isinstance(x, (int, str))` to
    # `isinstance(x, int | str)`. The new form constructs a UnionType
    # at every call (https://github.com/python/cpython/issues/103475),
    # which is measurable on hot paths. Keep the tuple form.
    # Newer ruff (≥ 0.1.x?) removed the rule entirely and warns that
    # the ignore is a no-op — that's fine; CI is pinned to 0.9.2 in
    # .github/workflows/lint.yml where the rule still fires.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=jctl --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["jctl"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
