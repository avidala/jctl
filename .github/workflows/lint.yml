name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # pin to the same versions as .pre-commit-config.yaml so a new
      # upstream release of black/ruff/bandit cannot break CI overnight.
      - name: Install lint tools
        run: |
          pip install black==24.10.0 ruff==0.9.2 bandit==1.9.1

      - name: Run black
        run: black jctl/ tests/ --check

      - name: Run ruff
        run: ruff check jctl/ tests/

      - name: Run bandit
        run: bandit -r jctl/ -ll

  # mypy was advisory while the codebase was being typed up. The QA
  # back-fill brought `mypy jctl/` to zero errors under the strict
  # pyproject.toml config, so this step is now blocking — re-introduce
  # type drift, the PR fails.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install project and mypy
        run: |
          pip install -e ".[dev]"
          pip install mypy==1.11.2

      - name: Run mypy
        run: mypy jctl/
