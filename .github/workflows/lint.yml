name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # pin to the same versions as .pre-commit-config.yaml so a new
      # upstream release of black/ruff/bandit cannot break CI overnight.
      - name: Install lint tools
        run: |
          pip install black==24.10.0 ruff==0.9.2 bandit==1.9.1

      - name: Run black
        run: black jctl/ tests/ --check

      - name: Run ruff
        run: ruff check jctl/ tests/

      - name: Run bandit
        run: bandit -r jctl/ -ll
