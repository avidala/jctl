name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # pin to the same versions as .pre-commit-config.yaml so a new
      # upstream release of black/ruff/bandit cannot break CI overnight.
      - name: Install lint tools
        run: |
          pip install black==24.10.0 ruff==0.9.2 bandit==1.9.1

      - name: Run black
        run: black jctl/ tests/ --check

      - name: Run ruff
        run: ruff check jctl/ tests/

      - name: Run bandit
        run: bandit -r jctl/ -ll

  # mypy is configured strictly in pyproject.toml but the codebase is
  # not yet fully typed. Run it in advisory mode — `|| true` keeps the
  # step green so the PR status summary stays useful. Remove the
  # trailing `|| true` once `mypy jctl/` is clean.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install project and mypy
        run: |
          pip install -e ".[dev]"
          pip install mypy==1.11.2

      - name: Run mypy (advisory)
        run: |
          echo "::group::mypy output (advisory — failures will not block this PR)"
          mypy jctl/ || mypy_exit=$?
          echo "::endgroup::"
          if [ -n "${mypy_exit:-}" ]; then
            echo "::warning::mypy reported $mypy_exit errors. Type drift is visible above but is not blocking; tighten `mypy jctl/` to unblock removing this advisory shim."
          fi
