name: Bump Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to bump (e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    # skip pre-releases on the auto trigger; allow manual dispatch always
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Checkout jctl
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for release asset to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/jctl-${{ steps.version.outputs.version }}.tar.gz"
          for i in $(seq 1 30); do
            if curl -sfL -o /dev/null "$URL"; then
              echo "Asset is available: $URL"
              exit 0
            fi
            echo "Attempt $i: asset not yet available, sleeping 10s..."
            sleep 10
          done
          echo "Asset never became available: $URL" >&2
          exit 1

      - name: Compute SHA256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/jctl-${{ steps.version.outputs.version }}.tar.gz"
          SHA=$(curl -sfL "$URL" | shasum -a 256 | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "Failed to compute SHA256" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate resources via homebrew-pypi-poet
        env:
          SDIST_URL: ${{ steps.sha.outputs.url }}
        run: |
          python -m venv /tmp/poet-venv
          /tmp/poet-venv/bin/pip install --quiet --upgrade pip
          # poet imports `pkg_resources`, which lives in setuptools. setuptools 81+
          # (June 2025) removed pkg_resources entirely, so pin to a version that
          # still has it. (poet itself is unmaintained — long-term we'd replace it.)
          /tmp/poet-venv/bin/pip install --quiet "setuptools<81" homebrew-pypi-poet
          # install jctl from the GitHub release sdist, NOT PyPI: PyPI's `jctl`
          # is a different package (Jamf tool) and cannot be used here.
          /tmp/poet-venv/bin/pip install --quiet "$SDIST_URL"
          /tmp/poet-venv/bin/poet jctl > /tmp/resources.rb
          echo "--- poet output (head) ---"
          head -20 /tmp/resources.rb

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: avidala/homebrew-jctl
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        working-directory: tap
        run: |
          python "$GITHUB_WORKSPACE/.github/scripts/update_formula.py" \
            --formula Formula/jctl.rb \
            --url "${{ steps.sha.outputs.url }}" \
            --sha256 "${{ steps.sha.outputs.sha }}" \
            --resources /tmp/resources.rb
          echo "--- Formula header ---"
          head -20 Formula/jctl.rb

      - name: Open pull request on tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="bump/v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/jctl.rb
          git commit -m "chore: bump jctl to ${{ steps.version.outputs.tag }}"
          # plain --force, not --force-with-lease: actions/checkout only fetches the
          # default branch, so we have no remote-tracking ref for an existing
          # `bump/vX.Y.Z` from a prior run, and --force-with-lease rejects with
          # "stale info". this branch is bot-managed end-to-end, safe to overwrite.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --repo avidala/homebrew-jctl >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH; updated branch."
          else
            gh pr create \
              --repo avidala/homebrew-jctl \
              --base main \
              --head "$BRANCH" \
              --title "chore: bump jctl to ${{ steps.version.outputs.tag }}" \
              --body "Automated bump from [jctl ${{ steps.version.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}). CI must pass before merge."
          fi
